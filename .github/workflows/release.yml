name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write  # required for PyPI Trusted Publishing (OIDC) -- no stored token
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches pyproject.toml version
        # $GITHUB_REF_NAME is a runner-provided env var (this push's own tag
        # name) -- not `${{ github.ref_name }}` string-interpolated into the
        # script, which is the safe pattern here.
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PYPROJECT_VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$TAG_VERSION" != "$PYPROJECT_VERSION" ]; then
            echo "::error::Tag v$TAG_VERSION does not match pyproject.toml version $PYPROJECT_VERSION -- bump pyproject.toml first"
            exit 1
          fi
          echo "OK: tag matches pyproject.toml version $PYPROJECT_VERSION"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Build wheel + sdist
        run: uv build

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # explicit, not `dist/*` -- `uv build` also drops a `dist/.gitignore`
          # (to keep the output dir out of git) that a broad glob picks up too
          files: |
            dist/*.whl
            dist/*.tar.gz
          generate_release_notes: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

  build-debs:
    needs: build-and-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        arch: [amd64, arm64, armhf]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Wait for the just-published version on PyPI
        # PyPI's index can take a few seconds to reflect a just-completed
        # upload; packaging/deb/build.sh installs this exact version from
        # PyPI (see its Dockerfile), so it must actually be there first.
        #
        # Checks the *simple* index specifically (what pip/uv actually
        # resolve against), not the /pypi/<name>/<version>/json API --
        # the two are backed by different caches and the JSON one has
        # gone green several seconds before the simple index (behind a
        # CDN) actually lists the file, which failed this exact job on
        # the 0.3.0 and 0.3.1 releases with "no version of frp-jump==...
        # found" a few seconds after this step reported success.
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          for _ in $(seq 1 20); do
            if curl -fsS "https://pypi.org/simple/frp-jump/" 2>/dev/null | grep -q "${VERSION}"; then
              echo "OK: frp-jump==${VERSION} is live on PyPI's simple index"
              exit 0
            fi
            sleep 10
          done
          echo "::error::frp-jump==${VERSION} never showed up on PyPI after ~200s"
          exit 1

      - name: Build the ${{ matrix.arch }} .deb
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          packaging/deb/build.sh "${{ matrix.arch }}" "$VERSION" dist-deb

      - name: Upload to the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist-deb/*.deb

  publish-apt-repo:
    needs: build-debs
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download this release's .deb files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist-deb
          gh release download "$GITHUB_REF_NAME" --repo "${{ github.repository }}" \
            --pattern '*.deb' --dir dist-deb

      - name: Import the apt repo signing key
        env:
          GNUPGHOME: ${{ runner.temp }}/gnupg
        run: |
          mkdir -m 700 -p "$GNUPGHOME"
          echo "${{ secrets.APT_SIGNING_KEY }}" | gpg --batch --import

      - name: Build the signed repo tree
        env:
          GNUPGHOME: ${{ runner.temp }}/gnupg
          GPG_SIGNING_FINGERPRINT: ${{ secrets.APT_SIGNING_KEY_FINGERPRINT }}
        run: packaging/apt/build-repo.sh dist-deb "${{ runner.temp }}/apt-build"

      - name: Publish to GitHub Pages (gh-pages branch)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ${{ runner.temp }}/apt-build/repo
          publish_branch: gh-pages
          # A fresh orphan commit per release instead of accumulating
          # history -- GitHub Releases is already the permanent archive
          # for every past .deb; this branch only needs to serve the
          # current one.
          force_orphan: true
