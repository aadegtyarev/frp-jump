[project]
name = "frp-jump"
version = "0.3.8"
description = "P2P-with-relay-fallback ssh/tcp tunnels between Linux boxes, built on frp"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Alexander Degtyarev", email = "a.degtyarev@struhe.com" }
]
requires-python = ">=3.12"
dependencies = [
    "typer>=0.15",
    "rich>=13.9",
    "tomli-w>=1.1",
    "httpx>=0.27",
    "pydantic-settings>=2.15.0",
]

[project.optional-dependencies]
# Only the server/control-plane needs these -- a device install
# (`pip install frp-jump`, no extra) stays lean. See `frp-jump-client`
# below, whose import chain never touches this. cryptography specifically
# has no prebuilt wheel on some platforms (e.g. Termux/Android) and needs
# a Rust toolchain to build from source -- worth keeping out of the
# client's dependency chain for that reason alone, not just size (see
# common/crypto.py's own `write_private_key`, which the client actually
# uses, deliberately kept dependency-free instead of living next to
# common/pki.py's real cryptography usage).
server = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlmodel>=0.0.22",
    "cryptography>=43.0",
]

[project.scripts]
frp-jump-client = "frp_jump.cli.client_cmds:app"
frp-jump-server = "frp_jump.cli.server_cmds:app"

[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# typer's whole CLI-argument API is this shape (a function call as the
# default) by design -- B008's mutable-default concern doesn't apply,
# typer itself consumes these at decoration time, not at call time.
extend-immutable-calls = ["typer.Argument", "typer.Option"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: downloads/spins up real frp binaries and hits the network; excluded by default",
]
addopts = ["-m", "not integration"]
asyncio_mode = "auto"
