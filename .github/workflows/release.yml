name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Build wheel + sdist
        run: uv build

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # explicit, not `dist/*` -- `uv build` also drops a `dist/.gitignore`
          # (to keep the output dir out of git) that a broad glob picks up too
          files: |
            dist/*.whl
            dist/*.tar.gz
          generate_release_notes: true
