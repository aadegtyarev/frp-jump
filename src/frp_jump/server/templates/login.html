{% extends "base.html" %}
{% block title %}Sign in &middot; frp-jump{% endblock %}
{% block content %}
<section class="card" style="max-width:420px; margin:60px auto 0; text-align:center;">
  <h1>Sign in</h1>
  <p class="muted">There's no password. Ask the admin for a login link, or open the one they sent you.</p>
  {% if error %}
  <div class="notice" style="margin-top:16px; text-align:left;">{{ error }}</div>
  {% endif %}
</section>
{% endblock %}
