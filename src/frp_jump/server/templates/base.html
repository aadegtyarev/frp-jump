<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}frp-jump{% endblock %}</title>
<style>
  :root{
    --bg:#f5f6f8; --surface:#ffffff; --border:#dfe3e8; --text:#1b2430; --muted:#5b6472;
    --accent:#3457d5; --accent-contrast:#ffffff; --danger:#c23a3a;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#12151b; --surface:#1a1f28; --border:#2b323e; --text:#e7ebf1; --muted:#8b94a3;
           --accent:#7c93ff; --accent-contrast:#0c1220; --danger:#f07171; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:var(--sans); line-height:1.45; }
  a { color: var(--accent); }
  header.top { display:flex; align-items:center; justify-content:space-between; padding:14px 24px;
               border-bottom:1px solid var(--border); background:var(--surface); }
  header.top .brand { font-weight:700; letter-spacing:-0.02em; font-size:1.05rem; }
  header.top .brand span { color:var(--accent); }
  main { max-width: 980px; margin: 0 auto; padding: 24px 20px 60px; }
  section.card { background:var(--surface); border:1px solid var(--border); border-radius:10px;
                 padding:20px 22px; margin-bottom:20px; }
  h1 { font-size:1.4rem; margin:0 0 4px; text-wrap: balance; }
  h2 { font-size:1.05rem; margin:0 0 14px; }
  table { width:100%; border-collapse: collapse; font-size:0.92rem; }
  th, td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--border); }
  th { color:var(--muted); font-weight:600; font-size:0.78rem; text-transform:uppercase; letter-spacing:.04em; }
  code, .mono { font-family:var(--mono); font-size:0.88em; }
  .pill { display:inline-block; padding:2px 9px; border-radius:999px; font-size:0.75rem; font-weight:600; }
  .pill.ssh { background:#eef1ff; color:#3457d5; }
  .pill.tcp { background:#eaf7ef; color:#1b8a5a; }
  .pill.http { background:#fff4e6; color:#b5860b; }
  @media (prefers-color-scheme: dark){
    .pill.ssh{ background:#232a4a; color:#9fb0ff;}
    .pill.tcp{ background:#173428; color:#7fe3ae;}
    .pill.http{ background:#3a2c11; color:#f0c675;}
  }
  form.inline { display:flex; gap:10px; flex-wrap:wrap; align-items:end; }
  label { display:block; font-size:0.78rem; color:var(--muted); margin-bottom:4px; }
  input, select { font:inherit; padding:7px 9px; border:1px solid var(--border); border-radius:6px;
                  background:var(--bg); color:var(--text); }
  button { font:inherit; padding:8px 14px; border-radius:6px; border:1px solid var(--accent);
           background:var(--accent); color:var(--accent-contrast); cursor:pointer; font-weight:600; }
  button:hover { filter:brightness(1.08); }
  button.ghost { background:transparent; color:var(--muted); border-color:var(--border); }
  .muted { color:var(--muted); }
  .empty { color:var(--muted); font-style:italic; padding:10px 0; }
  .notice { border:1px solid var(--border); border-left:4px solid var(--danger); background:var(--bg);
            padding:12px 14px; border-radius:6px; }
  pre.token { background:var(--bg); border:1px solid var(--border); border-radius:8px; padding:14px;
              white-space:pre-wrap; word-break:break-all; }
  @media (max-width: 560px) {
    form.inline { flex-direction: column; align-items: stretch; }
  }
</style>
</head>
<body>
<header class="top">
  <div class="brand">frp<span>&middot;</span>jump</div>
  {% if user %}
  <form action="/logout" method="post" style="margin:0; display:flex; align-items:center; gap:10px;">
    <span class="muted">{{ user.email }}{% if user.is_admin %} &middot; admin{% endif %}</span>
    <button type="submit" class="ghost">Sign out</button>
  </form>
  {% endif %}
</header>
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>
